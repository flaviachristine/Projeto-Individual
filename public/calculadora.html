    <main class="divLogoPrincipal">
        <div class="container">

            <!-- HIERARQUIA - NÍVEL 1: o saldo é o "visor" da calculadora.
                 É a informação mais importante da tela, então ocupa a largura
                 inteira e fica acima dos dois painéis de ação. -->
            <section class="painelSaldo">
                <span class="painelSaldo__titulo">Carteira</span>
                <div id="msg" class="msg1" aria-live="polite"></div>
            </section>

            <!-- HIERARQUIA - NÍVEL 2: os dois painéis de ação, lado a lado no desktop
                 e empilhados no celular. Ambos seguem exatamente a mesma estrutura
                 (campos -> ações -> mensagem), o que alinha os dois lados da tela. -->
            <section class="painel compra">
                <h1>Compra</h1>

                <div class="campos">
                    <div class="campo">
                        <label for="selectEstacaoCompra">Selecione uma estação</label>
                        <select id="selectEstacaoCompra" onchange="trocaSelectCompra()">
                            <option value="primavera">Primavera</option>
                            <option value="verao">Verão</option>
                            <option value="outono">Outono</option>
                            <option value="inverno">Inverno</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="selectFrutaCompra">Selecione o produto</label>
                        <select id="selectFrutaCompra"></select>
                    </div>

                    <div class="campo">
                        <label for="iptQtdCompra">Selecione a quantidade do produto</label>
                        <input type="number" id="iptQtdCompra" min="1" placeholder="Quantidade">
                    </div>
                </div>

                <!-- HIERARQUIA - NÍVEL 3: as ações. A secundária ("Adicionar") vem
                     primeiro e é mais discreta; a primária ("Comprar") fecha o fluxo. -->
                <div class="acoes">
                    <button type="button" class="btn btn--secundario"
                        onclick="adicionarCarrinho(selectFrutaCompra.value, iptQtdCompra.value)">Adicionar no
                        Carrinho</button>
                    <button type="button" class="btn btn--primario" onclick="comprar()">Comprar</button>
                </div>

                <!-- a resposta de cada ação agora fica dentro do painel a que pertence,
                     em vez de ficar em um bloco solto no meio da tela -->
                <div id="msgCompra" class="msg" aria-live="polite"></div>

                <div class="pierre" aria-hidden="true">
                    <img src="ASSETS/pierre.png" alt="">
                    <img src="ASSETS/pierreFala.png" alt="" class="falaPierre">
                </div>
            </section>

            <section class="painel venda">
                <h1>Venda</h1>

                <div class="campos">
                    <div class="campo">
                        <label for="selectEstacaoVenda">Selecione uma estação</label>
                        <select id="selectEstacaoVenda" onchange="trocaSelectVenda()">
                            <option value="primavera">Primavera</option>
                            <option value="verao">Verão</option>
                            <option value="outono">Outono</option>
                            <option value="inverno">Inverno</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="selectFrutaVenda">Selecione o produto</label>
                        <select id="selectFrutaVenda"></select>
                    </div>

                    <div class="campo">
                        <label for="iptQtdVenda">Selecione a quantidade do produto</label>
                        <input type="number" id="iptQtdVenda" min="1" placeholder="Quantidade">
                    </div>
                </div>

                <!-- a caixa de remessas é a decoração de fundo; os botões ficam por cima -->
                <div class="caixaRemessas">
                    <div class="acoes">
                        <button type="button" class="btn btn--secundario caixa"
                            onclick="adicionar(selectFrutaVenda.value, iptQtdVenda.value)">Adicionar na Caixa</button>
                        <button type="button" class="btn btn--primario caixa" onclick="vender()">Vender</button>
                    </div>
                </div>

                <div id="msgVenda" class="msg" aria-live="polite"></div>
            </section>

        </div>
    </main>
